
<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover" />
    <meta name="theme-color" content="#fcfaf5" />
    
    <!-- SEO & Social Media -->
    <title>오답노트메이커 - 로컬 보안 스캔 서비스</title>
    <meta name="description" content="문제 사진을 업로드하면 서버 전송 없이 내 기기에서 직접 자르고 보정하여 깔끔한 PDF 오답노트를 만들어주는 보안 중심 서비스입니다." />
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
      body {
        font-family: 'Noto Sans KR', sans-serif;
        background-color: #fcfaf5;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
      }
      #root {
        min-height: 100vh;
      }
      .pdf-page {
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      }
      @keyframes loading-bar {
        0% { width: 0%; }
        100% { width: 100%; }
      }
      .animate-loading-bar {
        animation: loading-bar 3.5s linear forwards;
      }
      /* 드래그 앤 드롭 영역 강조 */
      .drag-over {
        background-color: rgba(0, 0, 0, 0.02);
        border: 2px dashed #1a1a1a;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "lucide-react": "https://esm.sh/lucide-react@0.460.0",
    "jspdf": "https://esm.sh/jspdf@2.5.1",
    "html2canvas": "https://esm.sh/html2canvas@1.4.1",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "vite": "https://esm.sh/vite@^7.3.0",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
    <script type="module" src="index.tsx"></script>
  </body>
</html>
